 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOB APLICATION</title>
     <link rel="stylesheet" href="ja2.css"/>
 </head>
 <body>
   <div class="container">
   <div class="Apply_Box">
      <h1>DIPROMA INFOTECH</h1>
      <H5>JOIN THE FUTURE OF INVOTION WITH TECHNOLOGY!</H5>
  <form action="">
<div class="form_container">
<div class="form_control">
<label for="first_name">First Name</label>
<input id="first_name" name="first name"
 placeholder="Enter First Name...">
<div>
  <div class="form_control">
<label for="Last_name">Last Name</label>
<input id="Last_name" name=" Last name"
 placeholder="Enter Last Name..."> 
</div>
<div>
  <div class="form_control">
<label for="email">Email</label>
<input  type="email"
 id="email" 
name=" email"
 placeholder="Enter email@.com ..."> 
</div>

<div class="form_control">
<label for="profession">profession</label>
<select id="profession" name="profession">
   <option value="">Select Profession</option>
<option value="frontend">Frontend Developer </option>
<option value="backend">Backend Developer</option>
<option value="full stack">Full Stack Developer</option>
<option value="ui ux">UI UX </option>
<option value="ai">AI Developer</option>
<option value="designer">Designer</option>
</select> 
</div>
<div class="textarea_control">
<label for="address">Address</label>
<textarea id="address" name="address" row="4" cols="50"placeholder="Enter Address"></textarea>
<div class="form_control">
<label for="city">City</label>
<input id="city" name=" city"
 placeholder="Enter city...">
</div>
<div class="form_control">
<label for="pincode">Pincode</label>
<input 
type="number"
id="pincode" name=" pincode"
 placeholder="Enter pincode...">
<div class="form_control">
<label for="date">Date</label>
<input value="00-00-0000" type="date" id="date" name=" date">
</div>
<div class="form_control">
<label for="upload">Upload Resume</label>
<input  type="file" id="upload" name="upload">
<div class="button_container"></div>
<button type="submit">Apply Now!</button>
</div>
</div>
</div>
</div>
</div>
</div>
   </body>
   </html>
